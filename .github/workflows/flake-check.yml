name: Flake check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix in the ephemeral runner
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          enable_kvm: false

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h "$GITHUB_WORKSPACE" /nix

      - name: Evaluate Flake without building the system closure
        run: |
          nix flake lock
          nix flake metadata
          nix flake check --no-build --show-trace
          nix eval --raw .#nixosConfigurations.portable.config.system.build.toplevel.drvPath

      - name: Upload resolved lock file for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PortableNixOS-GitHub-flake-lock
          path: flake.lock
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
